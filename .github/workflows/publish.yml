name: Publish to npm

on:
  push:
    branches:
      - master
    paths:
      - "package.json"
      - "mcp/package.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Assert version parity between @practics/ui and @practics/ui-mcp ──────
      - name: Check version parity
        run: |
          LIB_VERSION=$(node -p "require('./package.json').version")
          MCP_VERSION=$(node -p "require('./mcp/package.json').version")
          if [ "$LIB_VERSION" != "$MCP_VERSION" ]; then
            echo "❌ Version mismatch: @practics/ui=$LIB_VERSION, @practics/ui-mcp=$MCP_VERSION"
            echo "Both packages must share the same version before publishing."
            exit 1
          fi
          echo "✓ Version parity: $LIB_VERSION"

      # ── Test both packages ────────────────────────────────────────────────────
      - name: Run library tests
        run: npm run test:run

      - name: Run MCP extract tests
        run: cd mcp && npx vitest run test/extract.test.ts

      # ── Build + extract ───────────────────────────────────────────────────────
      - name: Build library
        run: npm run build:lib

      # Regenerate components.json from source — this is what gets published.
      # We don't diff against the committed file because ts-morph output can
      # vary slightly across Node versions. The committed file is for PR review;
      # the freshly generated one is authoritative at publish time.
      - name: Generate components.json
        run: npm run mcp:extract

      - name: Verify components.json is valid JSON
        run: node -e "const d=require('./mcp/generated/components.json'); console.log('✓ components.json valid —', d.components.length, 'components, version', d.library.version)"

      - name: Build MCP server
        run: npm run mcp:build

      # ── Run MCP integration tests (after build + extract) ────────────────────
      - name: Run MCP integration tests
        run: npm run mcp:test

      # ── Publish @practics/ui ──────────────────────────────────────────────────
      - name: Publish @practics/ui to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish @practics/ui-mcp ──────────────────────────────────────────────
      - name: Publish @practics/ui-mcp to npm
        run: cd mcp && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
